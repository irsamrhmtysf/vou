<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A free, open-source voice translator for Indonesian, Arabic, English, Chinese, Korean, and Japanese."
    />
    <meta name="theme-color" content="#111714" />
    <title>V.O.U — Voice of Us</title>
    <link rel="stylesheet" href="app.css?v=3" />
    <script src="app.js?v=4" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="V.O.U home">
          <span>v.o.u</span>
        </a>
        <span class="topbar-note">Your Voice, Understood</span>
      </header>

        <div class="language-bar" aria-label="Translation languages">
          <label class="language-select">
            <span class="sr-only">from</span>
            <span class="language-flag flag-id" id="source-flag" aria-hidden="true"></span>
            <select id="source-language" aria-label="Translate from">
              <option value="id">Indonesia</option>
              <option value="ar">العربية</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <button
            class="swap-button"
            id="swap-languages"
            type="button"
            aria-label="Swap languages"
            title="Swap languages"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7h13m0 0-3-3m3 3-3 3M17 17H4m0 0 3 3m-3-3 3-3" />
            </svg>
          </button>
          <label class="language-select">
            <span class="sr-only">to</span>
            <span class="language-flag flag-eg" id="target-flag" aria-hidden="true"></span>
            <select id="target-language" aria-label="Translate to">
              <option value="ar">العربية</option>
              <option value="id">Indonesia</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <button
            class="icon-button clear-button"
            id="clear-button"
            type="button"
            aria-label="Clear text"
            title="Clear text"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16m-10 4v7m4-7v7M6 7l1 14h10l1-14M9 7V4h6v3" />
            </svg>
          </button>
          <button
            class="icon-button translate-button"
            id="translate-button"
            type="button"
            aria-label="Translate now"
            title="Translate now"
          >
            <span class="sr-only">Translate</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
          </button>
        </div>

        <div class="translation-grid">
          <section class="text-card input-card" aria-label="Text to translate">
            <div class="card-heading">
              <span class="card-language">
                <span class="language-flag flag-id" id="source-card-flag" aria-hidden="true"></span>
                <span id="source-label">Indonesia</span>
              </span>
              <span class="card-hint">YOU SAY</span>
            </div>
            <textarea
              id="source-text"
              rows="5"
              maxlength="1000"
              placeholder="Type something or tap the microphone to speak..."
              aria-label="Text to translate"
              dir="auto"
            ></textarea>
            <div class="card-footer">
              <span class="character-count" id="character-count">0 / 1000</span>
              <button
                class="icon-button listen-button"
                id="listen-button"
                type="button"
                aria-label="Start voice input"
                title="Start voice input"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="2.5" width="6" height="12" rx="3" />
                  <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5m-4 0h8" />
                </svg>
              </button>
            </div>
          </section>

          <section class="text-card output-card" aria-label="Translation">
            <div class="card-heading">
              <span class="card-language">
                <span class="language-flag flag-eg" id="target-card-flag" aria-hidden="true"></span>
                <span id="target-label">العربية</span>
              </span>
              <span class="card-hint">TRANSLATION</span>
            </div>
            <div
              class="translation-output"
              id="translation-output"
              role="status"
              aria-live="polite"
              dir="auto"
              lang="ar"
            >
              <span class="placeholder">Your translation will appear here.</span>
            </div>
            <div class="card-footer">
              <span class="status-message" id="status-message">Ready when you are.</span>
              <div class="output-actions">
                <button
                  class="icon-button"
                  id="speak-button"
                  type="button"
                  aria-label="Read translation aloud"
                  title="Read translation aloud"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" />
                  </svg>
                </button>
                <button
                  class="icon-button"
                  id="copy-button"
                  type="button"
                  aria-label="Copy translation"
                  title="Copy translation"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="8" y="8" width="12" height="13" rx="2" />
                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3" />
                  </svg>
                </button>
              </div>
            </div>
          </section>
        </div>

        <details class="settings">
          <summary>Translation Info</summary>
          <div class="settings-fields">
            <p>
              VOU uses MyMemory. Up to 1,000 characters per entry, sent in
              500-character parts. Free daily limit: 5,000 characters.
            </p>
          </div>
        </details>

        <footer class="app-footer">
          <span>irsamrhmtysf.github.io</span>
        </footer>
      </section>
    </main>
  </body>
</html>
