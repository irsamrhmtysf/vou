<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A free, open-source voice translator for Indonesian, Arabic, English, Chinese, Korean, and Japanese."
    />
    <meta name="theme-color" content="#111714" />
    <title>VOU Voice of Us</title>
    <link rel="stylesheet" href="app.css?v=7" />
    <script src="app.js?v=8" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="V.O.U home">
          <span>v.o.u</span>
        </a>
        <span class="topbar-note">Your Voice, Understood</span>
      </header>

        <div class="language-bar" aria-label="Translation languages">
          <div class="language-select">
            <span class="sr-only" id="source-language-label">from</span>
            <button
              class="language-picker-button"
              id="source-language-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="source-language-label source-language-value"
            >
            <span class="language-flag flag-id" id="source-flag" aria-hidden="true"></span>
              <span id="source-language-value">Indonesia</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </button>
            <div class="language-options" id="source-language-options" role="listbox" aria-labelledby="source-language-label" hidden></div>
            <select id="source-language" aria-hidden="true" hidden>
              <option value="id">Indonesia</option>
              <option value="ar">العربية</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="ja">日本語</option>
            </select>
          </div>
          <button
            class="swap-button"
            id="swap-languages"
            type="button"
            aria-label="Swap languages"
            title="Swap languages"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7h13m0 0-3-3m3 3-3 3M17 17H4m0 0 3 3m-3-3 3-3" />
            </svg>
          </button>
          <div class="language-select">
            <span class="sr-only" id="target-language-label">to</span>
            <button
              class="language-picker-button"
              id="target-language-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="target-language-label target-language-value"
            >
            <span class="language-flag flag-eg" id="target-flag" aria-hidden="true"></span>
              <span id="target-language-value">العربية</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </button>
            <div class="language-options" id="target-language-options" role="listbox" aria-labelledby="target-language-label" hidden></div>
            <select id="target-language" aria-hidden="true" hidden>
              <option value="ar">العربية</option>
              <option value="id">Indonesia</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
              <option value="ja">日本語</option>
            </select>
          </div>
        </div>

        <div class="translation-grid">
          <section class="text-card input-card" aria-label="Text to translate">
            <textarea
              id="source-text"
              rows="5"
              maxlength="1000"
              placeholder="Type something or tap the microphone to speak..."
              aria-label="Text to translate"
              dir="auto"
            ></textarea>
            <div class="card-footer">
              <span class="character-count" id="character-count">0 / 1000</span>
              <div class="input-actions">
                <button
                  class="icon-button listen-button"
                  id="listen-button"
                  type="button"
                  aria-label="Start voice input"
                  title="Start voice input"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="2.5" width="6" height="12" rx="3" />
                    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5m-4 0h8" />
                  </svg>
                </button>
                <button
                  class="icon-button clear-button"
                  id="clear-button"
                  type="button"
                  aria-label="Clear text"
                  title="Clear text"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18" />
                  </svg>
                </button>
                <button
                  class="icon-button translate-button"
                  id="translate-button"
                  type="button"
                  aria-label="Translate now"
                  title="Translate now"
                >
                  <span class="sr-only">Translate</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.5 5.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v11h-10a2 2 0 0 1-2-2zM8.5 8.5h10a2 2 0 0 1 2 2v8h-11a2 2 0 0 1-2-2zM6.5 8h6M9.5 7v2m-2 3 2 2 2-2m-2 2v2" />
                    <text x="14" y="17" fill="currentColor" stroke="none" font-size="6" font-weight="700">文</text>
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <section class="text-card output-card" aria-label="Translation">
            <div
              class="translation-output"
              id="translation-output"
              role="status"
              aria-live="polite"
              dir="auto"
              lang="ar"
            >
              <span class="placeholder">Your translation appear here.</span>
            </div>
            <div
              class="pronunciation-output"
              id="pronunciation-output"
              role="status"
              aria-live="polite"
              lang="en"
              dir="ltr"
              hidden
            ></div>
            <div class="card-footer">
              <span class="status-message" id="status-message">Ready when you are.</span>
              <div class="output-actions">
                <button
                  class="icon-button"
                  id="speak-button"
                  type="button"
                  aria-label="Read translation aloud"
                  title="Read translation aloud"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12" />
                  </svg>
                </button>
                <button
                  class="icon-button"
                  id="copy-button"
                  type="button"
                  aria-label="Copy translation"
                  title="Copy translation"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="8" y="8" width="12" height="13" rx="2" />
                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3" />
                  </svg>
                </button>
              </div>
            </div>
          </section>
        </div>

        <details class="settings">
          <summary>Translation Info</summary>
          <div class="settings-fields">
            <p>irsamrhmtysf.github.io</p>
            <p>
              Translation uses MyMemory first, with Google Translate as a
              fallback. Text may be sent to either service.
            </p>
          </div>
        </details>
      </section>
    </main>
  </body>
</html>
