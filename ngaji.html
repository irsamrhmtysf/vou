<!DOCTYPE html>
<html lang="id" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ngaji - Voice to Text & Translate</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #0f172a;
            --card: #1e293b;
            --primary: #14b8a6;
            --primary-hover: #0d9488;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: 32px;
            border: 1px solid var(--border);
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .app-header {
            margin-bottom: 28px;
        }
        h1 { font-size: 1.3rem; color: var(--primary); margin-bottom: 4px; font-weight: 600; letter-spacing: -0.3px; }
        p.subtitle { font-size: 0.8rem; color: var(--text-muted); }

        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .mic-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(20, 184, 166, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .mic-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .mic-btn svg {
            width: 44px;
            height: 44px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .mic-btn.recording {
            background: var(--danger);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 26px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            min-height: 20px; 
            font-weight: 400;
        }

        .result-box {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 20px;
            text-align: start;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section {
            margin-bottom: 18px;
        }
        .result-section:last-child {
            margin-bottom: 0;
        }

        .label { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .arabic-output {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            line-height: 1.9;
            text-align: right;
            direction: rtl;
            color: #ffffff;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .translation-wrapper {
            direction: ltr;
            text-align: left;
            background: rgba(3, 7, 18, 0.4);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(51, 65, 85, 0.4);
        }

        .translation-output {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        /* مجموعة الأزرار الثانوية (صوت + نسخ) */
        .actions-group {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(20, 184, 166, 0.25);
            color: var(--primary);
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .icon-btn:hover {
            background: rgba(20, 184, 166, 0.25);
            transform: scale(1.05);
        }

        .icon-btn.success {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            color: var(--success);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1>NGAJI</h1>
        <p class="subtitle">Voice to Text & Translate</p>
    </div>

    <div class="mic-section">
        <button id="micBtn" class="mic-btn" onclick="toggleRecording()" aria-label="Mulai Merekam">
            <svg id="micIcon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        <div id="status" class="status">Ketuk untuk mulai</div>
    </div>

    <div id="resultBox" class="result-box">
        <div class="result-section">
            <div class="label">
                <span>Teks Arab</span>
            </div>
            <div id="arabicText" class="arabic-output">-</div>
        </div>
        
        <div class="result-section" style="margin-top: 14px;">
            <div class="label">
                <span>Terjemahan</span>
                <div class="actions-group">
                    <!-- زر الاستماع -->
                    <button class="icon-btn" onclick="speakTranslation()" aria-label="Dengar Suara">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                    <!-- زر النسخ السريع -->
                    <button id="copyBtn" class="icon-btn" onclick="copyTranslation()" aria-label="Salin Teks">
                        <svg id="copyIcon" viewBox="0 0 24 24">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="translation-wrapper">
                <div id="translationText" class="translation-output">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    let isRecording = false;
    let recognition = null;
    let lastTranslatedText = "";

    // استرجاع آخر نتيجة محفوظة عند فتح التطبيق (Local Persistence)
    window.addEventListener('DOMContentLoaded', () => {
        const savedArabic = localStorage.getItem('recit_arabic');
        const savedTrans = localStorage.getItem('recit_trans');
        if (savedArabic && savedTrans) {
            document.getElementById('arabicText').innerText = savedArabic;
            document.getElementById('translationText').innerText = savedTrans;
            lastTranslatedText = savedTrans;
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('status').innerText = "Riwayat terakhir dimuat";
        }
    });

    function toggleRecording() {
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            status.innerText = "Browser tidak mendukung.";
            return;
        }

        if (!isRecording) {
            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = function() {
                    isRecording = true;
                    updateRecordingUI(true);
                    status.innerText = "Mendengarkan...";
                    resultBox.style.display = 'none';
                };

                recognition.onresult = async function(event) {
                    let arabicTranscript = event.results[0][0].transcript;
                    document.getElementById('arabicText').innerText = arabicTranscript;
                    status.innerText = "Menerjemahkan...";

                    let translatedText = await fetchDynamicTranslation(arabicTranscript);
                    lastTranslatedText = translatedText;
                    
                    document.getElementById('translationText').innerText = translatedText;
                    resultBox.style.display = 'block';
                    status.innerText = "Selesai";

                    // حفظ في التخزين المحلي
                    localStorage.setItem('recit_arabic', arabicTranscript);
                    localStorage.setItem('recit_trans', translatedText);
                };

                recognition.onerror = function(event) {
                    status.innerText = "Gagal mendengarkan. Coba lagi.";
                    stopState();
                };

                recognition.onend = function() {
                    stopState();
                };

                recognition.start();
            } catch (e) {
                status.innerText = "Error mikrofon.";
                stopState();
            }
        } else {
            if (recognition) {
                recognition.stop();
            }
            stopState();
        }
    }

    function updateRecordingUI(recording) {
        const btn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        if (recording) {
            btn.classList.add('recording');
            micIcon.innerHTML = '<path d="M6 6h12v12H6z"/>';
        } else {
            btn.classList.remove('recording');
            micIcon.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>';
        }
    }

    function stopState() {
        isRecording = false;
        updateRecordingUI(false);
    }

    async function fetchDynamicTranslation(text) {
        try {
            let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|id`;
            let response = await fetch(url);
            let data = await response.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
            return "Gagal mendapatkan terjemahan.";
        } catch (error) {
            return "Kesalahan jaringan.";
        }
    }

    function speakTranslation() {
        if (!lastTranslatedText) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(lastTranslatedText);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }

    function copyTranslation() {
        if (!lastTranslatedText) return;
        navigator.clipboard.writeText(lastTranslatedText).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const copyIcon = document.getElementById('copyIcon');
            
            copyBtn.classList.add('success');
            // تحويل أيقونة النسخ إلى علامة صح مؤقتاً
            copyIcon.innerHTML = '<path d="M9 16.2l-3.5-3.5L4.1 14.1l4.9 4.9L20.3 7.7l-1.4-1.4z"/>';
            
            setTimeout(() => {
                copyBtn.classList.remove('success');
                copyIcon.innerHTML = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>';
            }, 2000);
        });
    }
</script>

</body>
</html>
